      <p class="mt-2 text-gray-500">Angular @ for control flow</p>
    </div>

    <!-- Students -->
    <div>
      <h2 class="mb-4 text-xl font-bold text-gray-800">Students</h2>

      <div class="space-y-3">
        @for (student of students; track student.id) {
          <div
            class="flex items-center justify-between rounded-xl border border-gray-200 bg-gray-50 p-4 transition hover:shadow-md"
          >
            <div>
              <p class="font-semibold text-gray-800">
                {{ student.name }}
              </p>

              <p class="text-sm text-gray-500">Age: {{ student.age }}</p>
            </div>

            <button
              (click)="handleDelete(student.id)"
              class="rounded-lg bg-red-500 px-4 py-2 text-sm font-semibold text-white transition hover:bg-red-600 active:scale-95"
            >
              Delete
            </button>
          </div>

        } @empty {
          <div
            class="rounded-xl border-2 border-dashed border-gray-300 p-8 text-center text-gray-400"
          >
            No students found.
          </div>
        }
      </div>
    </div>
  </div>
</div>
