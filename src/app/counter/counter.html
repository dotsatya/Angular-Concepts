<div class="min-h-screen flex items-center justify-center bg-gray-100">
  <div class="w-full max-w-md rounded-2xl bg-white p-8 text-center shadow-lg">
    <h1 class="mb-6 text-3xl font-bold text-gray-800">Counter</h1>

    <p class="mb-8 text-6xl font-bold text-gray-900">
      {{ value }}
    </p>

    <div class="flex justify-center gap-3">
      <button
        (click)="handleCounter('increment')"
        class="rounded-lg bg-green-500 px-5 py-3 font-semibold text-white shadow-sm transition hover:bg-green-600 active:scale-95"
      >
        Increment
      </button>

      <button
        (click)="handleCounter('reset')"
        [disabled]="value === 0"
        class="rounded-lg bg-gray-500 px-5 py-3 font-semibold text-white shadow-sm transition hover:bg-gray-600 active:scale-95 disabled:cursor-not-allowed disabled:opacity-50 disabled:hover:bg-gray-500"
      >
        Reset
      </button>

      <button
        (click)="handleCounter('decrement')"
        [disabled]="value === 0"
        class="rounded-lg bg-red-500 px-5 py-3 font-semibold text-white shadow-sm transition hover:bg-red-600 active:scale-95 disabled:cursor-not-allowed disabled:opacity-50 disabled:hover:bg-red-500"
      >
        Decrement
      </button>
    </div>
  </div>
</div>
