<div class="min-h-screen flex flex-col items-center justify-center bg-gray-100">
  <div class="bg-white p-8 rounded-2xl shadow-lg text-center space-y-6">
    <h1 class="text-3xl font-bold text-gray-800">Angular Events</h1>

    <p class="text-gray-500">Try clicking or moving your mouse over the buttons</p>

    <div class="flex gap-4 justify-center">
      <!-- Click Event -->
      <button
        (click)="handleEvent($event)"
        class="px-6 py-3 rounded-lg bg-amber-400 text-gray-900 font-semibold hover:bg-amber-500 active:scale-95 transition-all duration-200"
      >
        Click Me
      </button>

      <!-- Mouse Enter Event -->
      <button
        (mouseenter)="handleEvent($event)"
        class="px-6 py-3 rounded-lg bg-blue-500 text-white font-semibold hover:bg-blue-600 transition-all duration-200"
      >
        Mouse Enter
      </button>
    </div>

    <div>
      <input
        type="text"
        (focus)="handleEvent($event)"
        (blur)="handleEvent($event)"
        (input)="handleEvent($event)"
        class="border-2 bg-amber-300 rounded-2xl px-4 py-2" 
        placeholder="Enter your name"
      />
    </div>
  </div>
</div>
